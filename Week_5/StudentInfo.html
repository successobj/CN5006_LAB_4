<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Enrollment Form</title>
</head>

<body bgcolor="beige">

    <form action="/submit-data" method="post">

        <h2>Student Details</h2>

        First Name:
        <input name="firstName" type="text" />
        <br><br>

        Last Name:
        <input name="lastName" type="text" />
        <br><br>

        Email:
        <input name="email" type="email" />
        <br><br>

        Age:
        <input name="myAge" type="text" />
        <br><br>

        <p>Please select your gender:</p>

        <input type="radio" name="gender" value="male">
        Male<br>

        <input type="radio" name="gender" value="female">
        Female<br>

        <input type="radio" name="gender" value="other">
        Other<br>

        <p>Qualifications</p>

        <input type="checkbox" name="Qual" value="GCSE">
        GCSE<br>

        <input type="checkbox" name="Qual" value="A-level">
        A-level<br>

        <input type="checkbox" name="Qual" value="Higher National Certificate">
        Higher National Certificate / Level 4<br>

        <input type="checkbox" name="Qual" value="HND">
        Foundation Degree / HND / Level 5<br>

        <input type="checkbox" name="Qual" value="B.Sc">
        Bachelor Degree / Level 6<br>

        <input type="checkbox" name="Qual" value="Master Degree">
        Master Degree / Level 7<br>

        <input type="checkbox" name="Qual" value="PhD">
        PhD / Level 8<br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
